    <body>

        <table border="1">          <!-- border="1" is used to add a border to the table -->

            <tr>                    <!-- tr is used to define a row in the table -->

                <td> Roll </td>     <!-- td is used to define a cell in the table -->

                <td> Name </td>     

                <td> GPA </td>      

            </tr>                   <!-- This is the header row of the table -->

            <tr>                    <!-- This is the first data row of the table -->

                <td> 101 </td>      <!-- This cell contains the roll number 101 -->

                <td> Paris </td>    <!-- This cell contains the name -->

                <td> 5.00 </td>     <!-- This cell contains the GPA -->

            </tr>
            
        </table>

    </body>

</html>
