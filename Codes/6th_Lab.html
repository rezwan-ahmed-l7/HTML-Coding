<html>
    <head>
        <title> Frame</title>
    </head>
    <body>

        <frameset cols="50%,60,*"> <!-- cols attribute is used to define the number of columns in the frameset and their width -->

            <frame src="practice 1.html"> <!-- frame tag is used to define a frame in the frameset and src attribute is used to specify the source of the content to be displayed in the frame -->

            <frame src="practice 2.html"> 

            <frame src="practice 3.html">

        </frameset>

    </body>
</html>
